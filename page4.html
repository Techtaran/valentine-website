<!DOCTYPE html>
<html>
<head>
    <title>Picture Page</title>
    <style>
        body {
            background-color: #ffd6e8;
            margin: 0;
            text-align: center;
        }

        .container {
            position: relative;
        }

        img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }

        .text {
            position: absolute;
            top: 20px;
            width: 100%;
            font-size: 40px;
            color: red;
            font-weight: bold;
        }

        .border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 15px solid red;
            box-sizing: border-box;
        }

        button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="border"></div>
    <div class="text">I LOVE YOU</div>

    <!-- Replace image.jpg with your uploaded image -->
    <img src="image.png">

    <button onclick="nextPage()">Next</button>
</div>

<script>
function nextPage() {
    window.location.href = "page5.html";
}
</script>

</body>
</html>
